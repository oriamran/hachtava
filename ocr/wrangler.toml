name = "hachtava-ocr"
main = "src/worker.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# מגבלת קצב לפי כתובת IP. יוצרים עם:
#   npx wrangler kv namespace create RATE
# ואז מדביקים כאן את ה-id שהפקודה מחזירה.
[[kv_namespaces]]
binding = "RATE"
id = "PASTE_KV_ID_HERE"

[vars]
# רק דפים מהמקורות האלה רשאים לקרוא לשרת.
ALLOWED_ORIGINS = "https://oriamran.github.io,http://localhost:8788"
