name = "hachtava-ocr"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

# מגבלת קצב לפי כתובת IP. יוצרים עם:
#   npx wrangler kv namespace create RATE
# ואז מדביקים כאן את ה-id שהפקודה מחזירה.
# התקדמות המשתמשים. נוצר עם:
#   npx wrangler kv namespace create DATA
[[kv_namespaces]]
binding = "DATA"
id = "e858ccd79f9140868096a85bb385cbb7"

[[kv_namespaces]]
binding = "RATE"
id = "98901eac17944c2293f979350b516917"

# הגבלת קצב אמיתית לכל כתובת IP, משותפת בין מופעי השרת. לא חובה, והקוד עובד גם בלעדיה.
# להפעלה: מוציאים מההערה ופורסים. (60 בקשות לדקה לכל כתובת)
# [[unsafe.bindings]]
# name = "RL"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }

[vars]
# מתג ראשי לסריקה. "false" = מושבת לכולם. להפעלה: "true" ואז wrangler deploy.
SCANS_ENABLED = "false"
# רק דפים מהמקורות האלה רשאים לקרוא לשרת.
ALLOWED_ORIGINS = "https://oriamran.github.io,http://localhost:8788"
# אם המודל לא נמצא, השרת מחזיר בשגיאה את השמות הזמינים
# ללא gemini-flash-lite — הוא ממציא מילים במקום לקרוא אותן
MODEL = "gemini-3.8-flash,gemini-flash-latest"
# מזהה הלקוח מ-Google Cloud Console. זה לא סוד.
GOOGLE_CLIENT_ID = "112684717494-sf1ajin7d13vpmkgd8nvtp9me5co1d7g.apps.googleusercontent.com"
